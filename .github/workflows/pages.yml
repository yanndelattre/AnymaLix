name: Publish AnymaLix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get the application files
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the installable app
        run: |
          mkdir site
          cp index.html manifest.webmanifest service-worker.js icone.png icone-180.png icone-192.png icone-512.png site/
      - name: Upload the static application
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish AnymaLix
        id: deployment
        uses: actions/deploy-pages@v4
